name: Docker

# 增强版 fork 专用：enhanced 分支推送即构建、验收并发布到 GHCR。
# 上游此工作流只验收不发布（发布在其 release.yml）；fork 不走上游发布链，故在此补齐发布。
on:
  push:
    branches: [enhanced]
    paths: [Dockerfile, .dockerignore, compose.yaml, 'src/**', 'migrations/**', 'web/**', 'resources/**', 'frontend/**', pyproject.toml, uv.lock, setup.py, MANIFEST.in, scripts/smoke_docker.py, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: 构建、验收并发布 GHCR 镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: docker/setup-buildx-action@v4
      - name: 构建候选镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/jjrexwang/peach-enhanced:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 验收临时容器
        run: python3 scripts/smoke_docker.py ghcr.io/jjrexwang/peach-enhanced:test
      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 计算版本标签
        id: ver
        run: |
          v=$(python3 -c "import re,pathlib; print(re.search(r'__version__ = "([^"]+)"', pathlib.Path('src/peach/__init__.py').read_text()).group(1))")
          echo "tags=ghcr.io/jjrexwang/peach-enhanced:enhanced,ghcr.io/jjrexwang/peach-enhanced:${v}-enhanced.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: 发布镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.ver.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
